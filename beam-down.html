<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Beam Down — Mingrui Xu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17160f;
    --paper:#f7f6f1;
    --muted:#6b6858;
    --line:rgba(23,22,15,0.12);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; overflow:hidden;
    overscroll-behavior:none; touch-action:none;
    background:#12141C;
    font-family:'Space Grotesk', sans-serif;
    color:var(--ink);
  }
  #app{ position:fixed; inset:0; }
  #app canvas{ display:block; width:100%; height:100%; }

  #loading{
    position:fixed; inset:0; z-index:50;
    background:#12141C;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px;
    transition:opacity .5s ease;
  }
  #loading.hidden{ opacity:0; pointer-events:none; }
  #loading .mark{ font-family:'Fraunces',serif; font-size:22px; color:#EDE9E0; }
  #loading .sub{ font-size:13px; color:rgba(237,233,224,0.55); }

  #hud-top{
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:20px 22px; pointer-events:none;
  }
  #hud-top .left-group{ display:flex; flex-direction:column; gap:8px; }
  #back-link{
    font-family:'Space Grotesk',sans-serif; font-size:13px;
    background:rgba(247,246,241,0.85); backdrop-filter:blur(6px);
    padding:8px 14px; border-radius:999px;
    pointer-events:auto; cursor:pointer; border:none; color:var(--ink);
    width:fit-content;
    transition:background .15s ease;
  }
  #back-link:hover{ background:rgba(247,246,241,0.98); }
  #project-tag{
    font-family:'Fraunces',serif; font-size:16px;
    background:rgba(247,246,241,0.75); backdrop-filter:blur(6px);
    padding:6px 12px; border-radius:999px;
    width:fit-content;
  }
  #hud-top .hint{
    position:fixed; top:20px; right:22px;
    font-size:12.5px; color:var(--ink);
    background:rgba(247,246,241,0.75); backdrop-filter:blur(6px);
    padding:7px 13px; border-radius:999px;
    max-width:220px; text-align:right; line-height:1.5;
    transition:opacity .6s ease;
  }
  #hud-top .hint.faded{ opacity:0; }

  #labels-layer{ position:fixed; inset:0; z-index:5; pointer-events:none; }
  .node-label{
    position:absolute; transform:translate(-50%,-100%);
    padding:5px 11px; border-radius:8px;
    background:rgba(247,246,241,0.88);
    border-bottom:2.5px solid var(--c, #333);
    font-size:12.5px; font-weight:500; white-space:nowrap;
    opacity:0; will-change:transform,opacity;
  }

  #joystick{
    display:none;
    position:fixed; left:26px; bottom:26px; z-index:20;
    width:118px; height:118px; border-radius:50%;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(247,246,241,0.4);
    touch-action:none;
  }
  @media (pointer:coarse){ #joystick{ display:block; } }
  #joystick-knob{
    position:absolute; left:50%; top:50%; width:52px; height:52px;
    margin:-26px 0 0 -26px; border-radius:50%;
    background:rgba(247,246,241,0.85);
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }

  #reset-btn{
    position:fixed; right:20px; bottom:26px; z-index:20;
    font-family:'Space Grotesk',sans-serif; font-size:12.5px;
    background:rgba(247,246,241,0.85); color:var(--ink);
    border:none; padding:10px 16px; border-radius:999px;
    cursor:pointer;
  }

  #quick-nav{ position:fixed; top:76px; right:22px; z-index:25; }
  #quick-nav-toggle{
    display:flex; align-items:center; gap:9px;
    background:rgba(247,246,241,0.85); border:none;
    padding:11px 18px; border-radius:999px;
    font-family:'Space Grotesk',sans-serif; font-size:14px; color:var(--ink);
    cursor:pointer;
  }
  #quick-nav-arrow{ display:inline-block; transition:transform .2s ease; font-size:15px; }
  #quick-nav.open #quick-nav-arrow{ transform:rotate(180deg); }
  #quick-nav-panel{
    margin-top:8px; background:rgba(247,246,241,0.96);
    border-radius:14px; overflow:hidden;
    max-height:0; opacity:0; transition:max-height .25s ease, opacity .2s ease;
    pointer-events:none;
  }
  #quick-nav.open #quick-nav-panel{ max-height:420px; opacity:1; pointer-events:auto; }
  .quick-nav-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 14px; cursor:pointer; white-space:nowrap;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .quick-nav-item:last-child{ border-bottom:none; }
  .quick-nav-item:hover{ background:rgba(23,22,15,0.05); }
  .quick-nav-swatch{ width:10px; height:10px; border-radius:50%; flex:none; }

  #prompt-modal{
    position:fixed; inset:0; z-index:30;
    display:flex; align-items:flex-start; justify-content:flex-start;
    padding:120px 20px 0 22px;
    transition:opacity .2s ease;
  }
  #prompt-modal.hidden{ opacity:0; pointer-events:none; }
  .prompt-card{
    width:320px; max-width:calc(100vw - 42px);
    background:var(--paper);
    border-radius:16px;
    padding:22px 22px 18px;
    border-top:4px solid var(--c,#333);
    box-shadow:0 14px 34px rgba(23,22,15,0.2);
    transform:translate(0,0);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
  }
  #prompt-modal.hidden .prompt-card{ transform:translate(-26px,-18px); }
  .prompt-card .kicker{ font-size:12px; color:var(--muted); margin-bottom:4px; }
  .prompt-card h3{ font-family:'Fraunces',serif; font-weight:400; font-size:23px; margin:0 0 14px; }
  .prompt-actions{ display:flex; gap:10px; }
  .prompt-actions button{
    flex:1; padding:11px 10px; border-radius:10px; border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:500;
    cursor:pointer; text-align:center; line-height:1.3;
  }
  .prompt-actions .btn-cn{ display:block; font-size:10.5px; font-weight:400; opacity:0.72; margin-top:1px; }
  .prompt-actions .btn-en{ display:block; font-size:14px; }
  .btn-primary{ background:var(--c,#28428a); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--line) !important; }

  #detail-panel{
    position:fixed; inset:0; z-index:40;
    background:var(--paper);
    transform:translateX(100%);
    transition:transform .38s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  #detail-panel.open{ transform:translateX(0); }
  .detail-hero{ height:34vh; min-height:200px; background:var(--c,#333); display:flex; align-items:flex-end; padding:24px; }
  .detail-hero span{ font-size:12.5px; color:rgba(255,255,255,0.85); background:rgba(0,0,0,0.18); padding:5px 11px; border-radius:999px; }
  .detail-body{ padding:28px 26px 60px; max-width:560px; }
  .detail-body h2{ font-family:'Fraunces',serif; font-weight:400; font-size:34px; margin:0 0 6px; }
  .detail-body .year{ font-size:13px; color:var(--muted); margin-bottom:22px; }
  .detail-body p{ font-size:16px; line-height:1.7; margin:0 0 16px; }
  .back-btn{
    position:fixed; top:18px; left:18px; z-index:41;
    background:rgba(247,246,241,0.92); border:none; padding:10px 16px;
    border-radius:999px; font-family:'Space Grotesk',sans-serif; font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="mark">Beam Down</div>
  <div class="sub">正在校准传送坐标…</div>
</div>

<div id="app"></div>
<div id="labels-layer"></div>

<header id="hud-top">
  <div class="left-group">
    <button id="back-link">← Map</button>
    <div id="project-tag">Beam Down</div>
  </div>
  <div class="hint" id="hint">WASD / 方向键行走<br>靠近控制台上的光点查看介绍</div>
</header>

<div id="joystick"><div id="joystick-knob"></div></div>
<button id="reset-btn">回到舱门</button>

<div id="quick-nav">
  <button id="quick-nav-toggle"><span>Decks</span><span id="quick-nav-arrow">⌄</span></button>
  <div id="quick-nav-panel"></div>
</div>

<div id="prompt-modal" class="hidden">
  <div class="prompt-card" id="prompt-card">
    <div class="kicker" id="prompt-medium">Medium</div>
    <h3 id="prompt-title">Section</h3>
    <div class="prompt-actions">
      <button class="btn-ghost" id="prompt-cancel">
        <span class="btn-cn">继续探索</span>
        <span class="btn-en">Keep exploring</span>
      </button>
      <button class="btn-primary" id="prompt-confirm">
        <span class="btn-cn">进去看看？</span>
        <span class="btn-en">Take a look?</span>
      </button>
    </div>
  </div>
</div>

<div id="detail-panel">
  <button class="back-btn" id="detail-back">← 返回飞船</button>
  <div class="detail-hero" id="detail-hero"><span id="detail-medium">Medium</span></div>
  <div class="detail-body">
    <h2 id="detail-title">Section</h2>
    <div class="year" id="detail-year">2024</div>
    <p id="detail-desc"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // Section data — 5 nodes on the ship's consoles/stations
  // ---------------------------------------------------------------
  var SECTIONS = [
    { id:"briefing", title:"Mission Briefing", medium:"Case study",     year:"2025", color:0x8E5CE0,
      desc:"《Beam Down》是一个第三人称俯视角的 Boss Rush 游戏，在里面担任游戏设计师与技术美术，主要负责玩家成长系统和部分战斗内容的设计。",
      x:0,  z:-8.5, gemY:1.4 },
    { id:"signal",   title:"The Signal",       medium:"Systems design", year:"2025", color:0x5C3D9E,
      desc:"主导设计了玩家的技能升级系统，包括技能机制、升级界面交互、技能命名和叙事文本，让数值成长也能讲故事。",
      x:-8, z:-2,  gemY:1.5 },
    { id:"calib",    title:"Calibration",      medium:"Combat design",  year:"2025", color:0xB18FE8,
      desc:"和团队一起打磨了第一个世界里敌人与 Boss 的战斗机制与视觉呈现，配合程序和美术把内容落地到游戏里。",
      x:8,  z:-2,  gemY:1.5 },
    { id:"debrief",  title:"Debrief",          medium:"Level design",   year:"2025", color:0x6B4A9E,
      desc:"也参与了第一个世界的关卡设计，需要同时兼顾玩法节奏和叙事需求。",
      x:-8, z:9,   gemY:1.3 },
    { id:"touchdown", title:"Touchdown",       medium:"VFX",            year:"2025", color:0x4FE8D9,
      desc:"参与设计了敌人技能的视觉特效，让战斗的可读性、反馈感和沉浸感更强——这也是「传送落地」这个主题最直接的体现。",
      x:0,  z:10,  gemY:1.6 }
  ];
  SECTIONS.forEach(function(s){ s.cssColor = "#" + s.color.toString(16).padStart(6, "0"); });

  var TRIGGER_RADIUS = 2.7, AWARE_RADIUS = 6.8, EXIT_BUFFER = 1.3;
  var ROOM_HALF_X = 11, ROOM_MIN_Z = -13, ROOM_MAX_Z = 13;

  function wrapAngle(a){
    return a - Math.PI * 2 * Math.floor((a + Math.PI) / (Math.PI * 2));
  }

  // ---------------------------------------------------------------
  // three.js setup
  // ---------------------------------------------------------------
  var container = document.getElementById("app");
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x12141C);
  scene.fog = new THREE.Fog(0x12141C, 20, 46);

  var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 300);
  var CAM_OFFSET = new THREE.Vector3(0, 15.5, -12);

  var renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x8C90B8, 0.65));
  var sun = new THREE.DirectionalLight(0xC9CCF2, 0.55);
  sun.position.set(10, 20, 8);
  scene.add(sun);

  // ---------- floor ----------
  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(22, 26),
    new THREE.MeshStandardMaterial({ color:0x33374A, flatShading:true })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  function glowStrip(w, d, x, z, color){
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ color:color, transparent:true, opacity:0.55 }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0.015, z);
    scene.add(m);
  }
  glowStrip(1.2, 24, 0, 0, 0x5C6BE8);
  function rug(x, z, r, color){
    var m = new THREE.Mesh(new THREE.CircleGeometry(r, 16), new THREE.MeshStandardMaterial({ color:color, flatShading:true }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0.012, z);
    scene.add(m);
  }
  rug(0, -8.5, 2.2, 0x3E4266);
  rug(-8, -2, 2.4, 0x3A3560);
  rug(8, -2, 2.4, 0x413A66);
  rug(-8, 9, 2.4, 0x3A3560);
  rug(0, 10, 2.8, 0x1F5C58);

  var doormat = new THREE.Mesh(
    new THREE.PlaneGeometry(1.6, 1.0),
    new THREE.MeshStandardMaterial({ color:0x2B2E42, flatShading:true })
  );
  doormat.rotation.x = -Math.PI / 2;
  doormat.position.set(0, 0.02, -12.3);
  scene.add(doormat);

  // ---------- hull walls ----------
  var wallMat = new THREE.MeshStandardMaterial({ color:0x2B2E42, flatShading:true });
  var panelMat = new THREE.MeshBasicMaterial({ color:0x8E5CE0, transparent:true, opacity:0.5 });

  function wall(w, h, d, x, y, z){
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    m.position.set(x, y, z);
    scene.add(m);
  }
  wall(0.4, 2.4, 26, -ROOM_HALF_X, 1.2, 0);
  wall(0.4, 2.4, 26, ROOM_HALF_X, 1.2, 0);
  wall(22.4, 2.4, 0.4, 0, 1.2, ROOM_MAX_Z);
  wall(7.5, 2.4, 0.4, -6.75, 1.2, ROOM_MIN_Z);
  wall(7.5, 2.4, 0.4, 6.75, 1.2, ROOM_MIN_Z);

  [-9, 9].forEach(function(x){
    [-8,-2,4,10].forEach(function(z){
      var strip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.35, 2.2), panelMat);
      strip.position.set(x, 1.6, z);
      scene.add(strip);
    });
  });

  // big viewscreen at the front wall (behind the bridge)
  var viewscreen = new THREE.Mesh(new THREE.BoxGeometry(4.4, 2.0, 0.06), new THREE.MeshBasicMaterial({ color:0x090B14 }));
  viewscreen.position.set(0, 1.7, -12.75);
  scene.add(viewscreen);
  for (var st=0; st<22; st++){
    var star = new THREE.Mesh(new THREE.SphereGeometry(0.02,4,4), new THREE.MeshBasicMaterial({ color:0xF2F0FA }));
    star.position.set(-2 + Math.random()*4, 0.9 + Math.random()*1.6, -12.72);
    scene.add(star);
  }

  // ---------------------------------------------------------------
  // ship furniture / stations
  // ---------------------------------------------------------------
  var hullMat = new THREE.MeshStandardMaterial({ color:0x40445C, flatShading:true });
  var traceMat = new THREE.MeshStandardMaterial({ color:0x21243A, flatShading:true });
  var pipeMat = new THREE.MeshStandardMaterial({ color:0x5A5E78, flatShading:true });

  function box(w,h,d,mat,x,y,z){
    var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    m.position.set(x,y,z);
    scene.add(m);
    return m;
  }
  function cylinder(r1,r2,h,mat,x,y,z){
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,10), mat);
    m.position.set(x,y,z);
    scene.add(m);
    return m;
  }
  function screenGlow(w,h,x,y,z,color){
    var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.01), new THREE.MeshBasicMaterial({ color:color }));
    m.position.set(x,y,z);
    scene.add(m);
    return m;
  }

  // ---- bridge (hosts "Mission Briefing") ----
  box(2.0, 0.8, 0.7, hullMat, 0, 0.4, -8.9);
  screenGlow(1.6, 0.35, 0, 0.72, -8.55, 0x8E5CE0);
  box(0.5, 0.55, 0.5, traceMat, 0, 0.28, -7.7);          // captain's seat base
  box(0.5, 0.06, 0.5, traceMat, 0, 0.55, -7.7);

  // ---- signal console (hosts "The Signal") ----
  box(1.3, 0.85, 0.55, hullMat, -8, 0.42, -1.8);
  screenGlow(1.0, 0.4, -8, 0.86, -1.53, 0x5C3D9E);
  cylinder(0.03,0.03,0.5, pipeMat, -8, 1.4, -2.3);
  cylinder(0.14,0.14,0.04, pipeMat, -8, 1.66, -2.3);      // little dish

  // ---- engineering / calibration bay (hosts "Calibration") ----
  cylinder(0.32, 0.32, 0.9, traceMat, 8, 0.45, -1.8);
  var core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.22,0), new THREE.MeshBasicMaterial({ color:0xB18FE8 }));
  core.position.set(8, 1.0, -1.8);
  scene.add(core);
  [-0.5,0.5].forEach(function(dx){
    cylinder(0.05,0.05,1.4, pipeMat, 8+dx, 0.7, -1.0);
  });
  box(0.7, 0.6, 0.4, hullMat, 8, 0.3, -0.3);             // small console (hosts "Calibration")
  screenGlow(0.5, 0.25, 8, 0.55, -0.09, 0xB18FE8);

  // ---- debrief table (hosts "Debrief") ----
  cylinder(0.75, 0.75, 0.06, hullMat, -8, 0.72, 9);
  cylinder(0.08,0.08,0.72, traceMat, -8, 0.36, 9);
  var holo = new THREE.Mesh(new THREE.CircleGeometry(0.4,12), new THREE.MeshBasicMaterial({ color:0x6B4A9E, transparent:true, opacity:0.5, side:THREE.DoubleSide }));
  holo.rotation.x = -Math.PI/2;
  holo.position.set(-8, 1.05, 9);
  scene.add(holo);
  [0,1,2,3].forEach(function(i){
    var ang = i/4*Math.PI*2;
    box(0.32,0.42,0.32, traceMat, -8+Math.cos(ang)*1.05, 0.32, 9+Math.sin(ang)*1.05); // stools
  });

  // ---- teleporter bay (hosts "Touchdown") ----
  cylinder(1.5, 1.6, 0.15, hullMat, 0, 0.08, 10);
  cylinder(1.3, 1.3, 0.02, new THREE.MeshBasicMaterial({ color:0x4FE8D9, transparent:true, opacity:0.55 }), 0, 0.17, 10);
  [0,1,2,3].forEach(function(i){
    var ang = i/4*Math.PI*2 + 0.4;
    cylinder(0.06,0.06,2.2, hullMat, Math.cos(ang)*1.5, 1.1, 10+Math.sin(ang)*1.5);
    var cap = new THREE.Mesh(new THREE.IcosahedronGeometry(0.12,0), new THREE.MeshBasicMaterial({ color:0x4FE8D9 }));
    cap.position.set(Math.cos(ang)*1.5, 2.2, 10+Math.sin(ang)*1.5);
    scene.add(cap);
  });

  // scattered cargo crates for atmosphere
  [[9.5,3.5],[-9.5,4],[9.6,-9],[-9.6,-9.5],[6.2,6.5]].forEach(function(p){
    box(0.6,0.6,0.6, hullMat, p[0], 0.3, p[1]);
  });

  // ---------------------------------------------------------------
  // glow texture + node markers (on the ship's stations)
  // ---------------------------------------------------------------
  function makeGlowTexture(){
    var size = 64;
    var canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext("2d");
    var g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.35, "rgba(255,255,255,0.7)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(canvas);
  }
  var glowTexture = makeGlowTexture();
  var PARTICLE_COUNT = 12;

  var nodeMarkers = [];
  SECTIONS.forEach(function(s){
    var group = new THREE.Group();
    group.position.set(s.x, 0, s.z);

    var pad = new THREE.Mesh(
      new THREE.CircleGeometry(1.1, 10),
      new THREE.MeshBasicMaterial({ color:s.color, transparent:true, opacity:0.32 })
    );
    pad.rotation.x = -Math.PI / 2;
    pad.position.y = 0.03;

    var gem = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.32, 0),
      new THREE.MeshStandardMaterial({ color:s.color, flatShading:true, roughness:0.4 })
    );
    gem.position.y = s.gemY;

    var particlePositions = new Float32Array(PARTICLE_COUNT * 3);
    var particleParams = [];
    for (var pi = 0; pi < PARTICLE_COUNT; pi++){
      particleParams.push({
        radius: 0.3 + Math.random() * 0.4,
        height: s.gemY - 0.3 + Math.random() * 1.1,
        speed: 0.35 + Math.random() * 0.7,
        phase: Math.random() * Math.PI * 2,
        bobSpeed: 0.6 + Math.random() * 0.9,
        bobAmp: 0.1 + Math.random() * 0.16
      });
    }
    var particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute("position", new THREE.BufferAttribute(particlePositions, 3));
    var particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({
      size:0.26, map:glowTexture, color:s.color, transparent:true, opacity:0.95,
      blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
    }));

    group.add(pad, gem, particles);
    scene.add(group);

    var label = document.createElement("div");
    label.className = "node-label";
    label.style.setProperty("--c", s.cssColor);
    label.textContent = s.title;
    document.getElementById("labels-layer").appendChild(label);

    nodeMarkers.push({
      project:s, gem:gem, label:label, phase:Math.random()*10,
      particles:particles, particlePositions:particlePositions, particleParams:particleParams,
      gemBaseY:s.gemY
    });
  });

  var qnRoot = document.getElementById("quick-nav");
  var qnToggle = document.getElementById("quick-nav-toggle");
  var qnPanel = document.getElementById("quick-nav-panel");
  SECTIONS.forEach(function(s, i){
    var item = document.createElement("div");
    item.className = "quick-nav-item";
    item.innerHTML = '<span class="quick-nav-swatch" style="background:' + s.cssColor + '"></span><span>' + s.title + "</span>";
    item.addEventListener("click", function(){
      qnRoot.classList.remove("open");
      openDetail(nodeMarkers[i]);
    });
    qnPanel.appendChild(item);
  });
  qnToggle.addEventListener("click", function(){ qnRoot.classList.toggle("open"); dismissHint(); });

  document.getElementById("back-link").addEventListener("click", function(){
    window.location.href = "index.html";
  });

  // ---------------------------------------------------------------
  // player: E.R.O.-4 robot — cream/gold plating, teal glow accents
  // ---------------------------------------------------------------
  var bodyMat = new THREE.MeshStandardMaterial({ color:0xF0E6D2, flatShading:true });
  var armorMat = new THREE.MeshStandardMaterial({ color:0xE0A83D, flatShading:true });
  var glowMat = new THREE.MeshBasicMaterial({ color:0x4FE8D9 });

  var player = new THREE.Group();

  var legGeo = new THREE.BoxGeometry(0.15, 0.75, 0.15);
  legGeo.translate(0, -0.375, 0);
  var footGeo = new THREE.ConeGeometry(0.09, 0.24, 4);
  footGeo.rotateX(Math.PI / 2);

  var legL = new THREE.Group();
  legL.position.set(-0.14, 0.75, 0);
  legL.add(new THREE.Mesh(legGeo, bodyMat));
  var kneeArmorL = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.16,0.18), armorMat);
  kneeArmorL.position.set(0, -0.38, 0.03);
  legL.add(kneeArmorL);
  var kneeGemL = new THREE.Mesh(new THREE.IcosahedronGeometry(0.045,0), glowMat);
  kneeGemL.position.set(0, -0.38, 0.13);
  legL.add(kneeGemL);
  var footL = new THREE.Mesh(footGeo, armorMat);
  footL.position.set(0, -0.76, 0.1);
  footL.rotation.x += -0.4;
  legL.add(footL);
  player.add(legL);

  var legR = new THREE.Group();
  legR.position.set(0.14, 0.75, 0);
  legR.add(new THREE.Mesh(legGeo, bodyMat));
  var kneeArmorR = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.16,0.18), armorMat);
  kneeArmorR.position.set(0, -0.38, 0.03);
  legR.add(kneeArmorR);
  var kneeGemR = new THREE.Mesh(new THREE.IcosahedronGeometry(0.045,0), glowMat);
  kneeGemR.position.set(0, -0.38, 0.13);
  legR.add(kneeGemR);
  var footR = new THREE.Mesh(footGeo, armorMat);
  footR.position.set(0, -0.76, 0.1);
  footR.rotation.x += -0.4;
  legR.add(footR);
  player.add(legR);

  var torso = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.44, 0.26), bodyMat);
  torso.position.set(0, 1.08, 0);
  player.add(torso);

  [-1,1].forEach(function(side){
    var pauldron = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.18,0.24), armorMat);
    pauldron.position.set(side*0.32, 1.28, -0.01);
    pauldron.rotation.z = -side*0.18;
    player.add(pauldron);
  });
  var chestGem = new THREE.Mesh(new THREE.IcosahedronGeometry(0.08,0), glowMat);
  chestGem.position.set(0, 1.14, 0.14);
  player.add(chestGem);

  var hipArmor = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.16,0.28), armorMat);
  hipArmor.position.set(0, 0.82, 0);
  player.add(hipArmor);

  var armGeo = new THREE.BoxGeometry(0.12, 0.3, 0.12);
  armGeo.translate(0, -0.15, 0);
  var handGeo = new THREE.BoxGeometry(0.1, 0.2, 0.1);
  handGeo.translate(0, -0.3-0.1, 0);
  var armL = new THREE.Group();
  armL.position.set(-0.32, 1.2, 0);
  armL.add(new THREE.Mesh(armGeo, bodyMat));
  armL.add(new THREE.Mesh(handGeo, armorMat));
  player.add(armL);
  var armR = new THREE.Group();
  armR.position.set(0.32, 1.2, 0);
  armR.add(new THREE.Mesh(armGeo, bodyMat));
  armR.add(new THREE.Mesh(handGeo, armorMat));
  player.add(armR);

  var head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0), bodyMat);
  head.scale.set(0.82, 1.25, 0.86);
  head.position.set(0, 1.62, 0);
  player.add(head);

  var hornGeo = new THREE.ConeGeometry(0.035, 0.22, 4);
  [-1,1].forEach(function(side){
    [0,1].forEach(function(i){
      var horn = new THREE.Mesh(hornGeo, armorMat);
      horn.position.set(side*(0.06+i*0.05), 1.82+i*0.02, -0.03-i*0.03);
      horn.rotation.z = -side*0.35;
      horn.rotation.x = -0.25 - i*0.15;
      player.add(horn);
    });
  });
  [-1,1].forEach(function(side){
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.026,6,6), glowMat);
    eye.position.set(side*0.06, 1.63, 0.17);
    player.add(eye);
  });

  var shadowBlob = new THREE.Mesh(
    new THREE.CircleGeometry(0.4, 10),
    new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.28 })
  );
  shadowBlob.rotation.x = -Math.PI / 2;
  shadowBlob.position.y = 0.02;
  player.add(shadowBlob);

  scene.add(player);

  // ---------------------------------------------------------------
  // input
  // ---------------------------------------------------------------
  var keys = { fwd:false, back:false, left:false, right:false };
  window.addEventListener("keydown", function(e){
    switch(e.key){
      case "w": case "W": case "ArrowUp": keys.fwd = true; break;
      case "s": case "S": case "ArrowDown": keys.back = true; break;
      case "a": case "A": case "ArrowLeft": keys.left = true; break;
      case "d": case "D": case "ArrowRight": keys.right = true; break;
    }
    dismissHint();
  });
  window.addEventListener("keyup", function(e){
    switch(e.key){
      case "w": case "W": case "ArrowUp": keys.fwd = false; break;
      case "s": case "S": case "ArrowDown": keys.back = false; break;
      case "a": case "A": case "ArrowLeft": keys.left = false; break;
      case "d": case "D": case "ArrowRight": keys.right = false; break;
    }
  });

  var joystick = document.getElementById("joystick");
  var knob = document.getElementById("joystick-knob");
  var joyVec = { x:0, y:0 };
  var joyActive = false, joyId = null, joyBaseRect = null;

  joystick.addEventListener("pointerdown", function(e){
    joyActive = true; joyId = e.pointerId;
    joyBaseRect = joystick.getBoundingClientRect();
    joystick.setPointerCapture(e.pointerId);
    updateJoy(e);
    dismissHint();
  });
  joystick.addEventListener("pointermove", function(e){
    if (joyActive && e.pointerId === joyId) updateJoy(e);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(evt){
    joystick.addEventListener(evt, function(e){
      if (e.pointerId !== joyId) return;
      joyActive = false; joyVec.x = 0; joyVec.y = 0;
      knob.style.transform = "translate(0px,0px)";
    });
  });
  function updateJoy(e){
    var cx = joyBaseRect.left + joyBaseRect.width/2;
    var cy = joyBaseRect.top + joyBaseRect.height/2;
    var dx = e.clientX - cx, dy = e.clientY - cy;
    var max = joyBaseRect.width/2;
    var dist = Math.min(Math.hypot(dx,dy), max);
    var ang = Math.atan2(dy,dx);
    var kx = Math.cos(ang)*dist, ky = Math.sin(ang)*dist;
    knob.style.transform = "translate(" + kx + "px," + ky + "px)";
    joyVec.x = kx/max;
    joyVec.y = ky/max;
  }

  function dismissHint(){
    var hint = document.getElementById("hint");
    if (hint) hint.classList.add("faded");
  }
  setTimeout(dismissHint, 5000);

  var playerState = { x:0, z:-12, heading:0 };
  var walkPhase = 0, walkBlend = 0;

  document.getElementById("reset-btn").addEventListener("click", function(){
    playerState.x = 0; playerState.z = -12; playerState.heading = 0;
  });

  // ---------------------------------------------------------------
  // state machine: exploring / detail
  // ---------------------------------------------------------------
  var appMode = "exploring";
  var cooldownId = null;
  var activeNode = null;

  var promptModal = document.getElementById("prompt-modal");
  var promptCard = document.getElementById("prompt-card");
  var promptTitle = document.getElementById("prompt-title");
  var promptMedium = document.getElementById("prompt-medium");
  var promptConfirm = document.getElementById("prompt-confirm");
  var promptCancel = document.getElementById("prompt-cancel");

  var detailPanel = document.getElementById("detail-panel");
  var detailHero = document.getElementById("detail-hero");
  var detailTitle = document.getElementById("detail-title");
  var detailMedium = document.getElementById("detail-medium");
  var detailYear = document.getElementById("detail-year");
  var detailDesc = document.getElementById("detail-desc");
  var detailBack = document.getElementById("detail-back");

  function openPrompt(node){
    activeNode = node;
    promptCard.style.setProperty("--c", node.project.cssColor);
    promptTitle.textContent = node.project.title;
    promptMedium.textContent = node.project.medium;
    promptModal.classList.remove("hidden");
  }
  function closePrompt(withCooldown){
    promptModal.classList.add("hidden");
    if (withCooldown && activeNode) cooldownId = activeNode.project.id;
  }
  promptCancel.addEventListener("click", function(){ closePrompt(true); });
  promptConfirm.addEventListener("click", function(){
    promptModal.classList.add("hidden");
    openDetail(activeNode);
  });

  function openDetail(node){
    appMode = "detail";
    detailHero.style.background = node.project.cssColor;
    detailMedium.textContent = node.project.medium;
    detailTitle.textContent = node.project.title;
    detailYear.textContent = node.project.year;
    detailDesc.textContent = node.project.desc;
    detailPanel.classList.add("open");
  }
  detailBack.addEventListener("click", function(){
    detailPanel.classList.remove("open");
    if (activeNode) cooldownId = activeNode.project.id;
    appMode = "exploring";
  });

  // ---------------------------------------------------------------
  // player movement (camera-relative, character auto-faces motion)
  // ---------------------------------------------------------------
  var WALK_SPEED = 6.0;

  function updatePlayer(dt){
    var throttle = (keys.fwd ? 1 : 0) - (keys.back ? 1 : 0);
    throttle += -joyVec.y;
    throttle = Math.max(-1, Math.min(1, throttle));

    var steer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    steer += joyVec.x;
    steer = Math.max(-1, Math.min(1, steer));

    var mx = -steer, mz = throttle;
    var mag = Math.hypot(mx, mz);
    if (mag > 1){ mx /= mag; mz /= mag; }

    playerState.x += mx * WALK_SPEED * dt;
    playerState.z += mz * WALK_SPEED * dt;
    playerState.x = Math.max(-ROOM_HALF_X + 0.6, Math.min(ROOM_HALF_X - 0.6, playerState.x));
    playerState.z = Math.max(ROOM_MIN_Z + 0.6, Math.min(ROOM_MAX_Z - 0.6, playerState.z));

    var moving = mag > 0.05;
    if (moving){
      var targetHeading = Math.atan2(mx, mz);
      var diff = wrapAngle(targetHeading - playerState.heading);
      playerState.heading = wrapAngle(playerState.heading + diff * Math.min(1, 12 * dt));
    }
    walkBlend += ((moving ? 1 : 0) - walkBlend) * Math.min(1, 8 * dt);
    walkPhase += dt * 8 * Math.max(0.15, walkBlend);

    player.position.set(playerState.x, 0, playerState.z);
    player.rotation.y = playerState.heading;

    var swing = Math.sin(walkPhase) * 0.5 * walkBlend;
    legL.rotation.x = swing;
    legR.rotation.x = -swing;
    armL.rotation.x = -swing * 0.8;
    armR.rotation.x = swing * 0.8;

    checkNodeTriggers();
  }

  function checkNodeTriggers(){
    if (appMode !== "exploring") return;
    nodeMarkers.forEach(function(n){
      var d = Math.hypot(playerState.x - n.project.x, playerState.z - n.project.z);
      if (d < TRIGGER_RADIUS) {
        if (cooldownId !== n.project.id && activeNode !== n) openPrompt(n);
      } else if (d > TRIGGER_RADIUS + EXIT_BUFFER) {
        if (activeNode === n) {
          promptModal.classList.add("hidden");
          activeNode = null;
        }
        if (cooldownId === n.project.id) cooldownId = null;
      }
    });
  }

  function updateNodes(dt){
    nodeMarkers.forEach(function(n){
      n.gem.rotation.y += dt * 0.6;
      n.gem.rotation.x += dt * 0.35;
      n.gem.position.y = n.gemBaseY + Math.sin(elapsed * 1.4 + n.phase) * 0.14;

      for (var pi = 0; pi < n.particleParams.length; pi++){
        var pp = n.particleParams[pi];
        var ang = elapsed * pp.speed + pp.phase;
        var py = pp.height + Math.sin(elapsed * pp.bobSpeed + pp.phase) * pp.bobAmp;
        n.particlePositions[pi * 3] = Math.cos(ang) * pp.radius;
        n.particlePositions[pi * 3 + 1] = py;
        n.particlePositions[pi * 3 + 2] = Math.sin(ang) * pp.radius;
      }
      n.particles.geometry.attributes.position.needsUpdate = true;

      var d = Math.hypot(playerState.x - n.project.x, playerState.z - n.project.z);
      var op = d < AWARE_RADIUS
        ? Math.max(0, Math.min(1, 1 - (d - TRIGGER_RADIUS) / (AWARE_RADIUS - TRIGGER_RADIUS)))
        : 0;
      n.label.style.opacity = op;

      var v = new THREE.Vector3(n.project.x, n.gemBaseY + 0.6, n.project.z);
      v.project(camera);
      if (v.z < 1) {
        n.label.style.left = ((v.x * 0.5 + 0.5) * window.innerWidth) + "px";
        n.label.style.top = ((-v.y * 0.5 + 0.5) * window.innerHeight) + "px";
      } else {
        n.label.style.opacity = 0;
      }
    });
  }

  // ---------------------------------------------------------------
  // camera + loop
  // ---------------------------------------------------------------
  var camPos = new THREE.Vector3(CAM_OFFSET.x, CAM_OFFSET.y, CAM_OFFSET.z + playerState.z);
  var clock = new THREE.Clock();
  var elapsed = 0;

  function animate(){
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;

    if (appMode === "exploring") updatePlayer(dt);

    var desired = new THREE.Vector3(playerState.x + CAM_OFFSET.x, CAM_OFFSET.y, playerState.z + CAM_OFFSET.z);
    camPos.lerp(desired, 1 - Math.pow(0.001, dt));
    camera.position.copy(camPos);
    camera.lookAt(playerState.x, 0.9, playerState.z);
    camera.updateMatrixWorld();

    updateNodes(dt);

    renderer.render(scene, camera);
  }

  window.addEventListener("resize", function(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  requestAnimationFrame(function(){
    document.getElementById("loading").classList.add("hidden");
    animate();
  });

})();
</script>
</body>
</html>
